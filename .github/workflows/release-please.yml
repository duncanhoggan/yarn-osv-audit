name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Steps below only run when release-please merged its PR and cut a release.
      # GITHUB_TOKEN-driven tag pushes don't trigger other workflows, so the
      # publish has to happen inside this job rather than via a tag-based hook.
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}

      - name: Use Node.js 22
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: yarn

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: yarn install --frozen-lockfile

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: yarn build

      - name: Test
        if: ${{ steps.release.outputs.release_created }}
        run: yarn vitest run

      # npm Trusted Publishers (OIDC) requires npm CLI >= 11.5.1; Node 22 ships
      # with npm 10.x, so upgrade before the publish step.
      - name: Upgrade npm for Trusted Publishers
        if: ${{ steps.release.outputs.release_created }}
        run: npm install -g npm@latest

      # No NPM_TOKEN — the npm CLI exchanges the GitHub OIDC token (granted by
      # `id-token: write`) for a short-lived publish credential. The package
      # must be configured on npmjs.com → Publishing access → Trusted Publisher
      # for org `duncanhoggan`, repo `yarn-osv-audit`, workflow `release-please.yml`.
      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish --provenance --access public
