name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Run the full CI matrix (Build and test) before publishing — release is
  # gated on CI success across every supported Node version.
  ci:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [release-please, ci]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships with npm 11.x, which is required for Trusted Publishers
      # (OIDC). Avoids the `npm install -g npm@latest` self-upgrade bug seen on
      # Node 22 (`Cannot find module 'promise-retry'`).
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      # No NPM_TOKEN — the npm CLI exchanges the GitHub OIDC token (granted by
      # `id-token: write`) for a short-lived publish credential. The package
      # must be configured on npmjs.com → Publishing access → Trusted Publisher
      # for org `duncanhoggan`, repo `yarn-osv-audit`, workflow `release-please.yml`.
      - name: Publish to npm
        run: npm publish --provenance --access public
